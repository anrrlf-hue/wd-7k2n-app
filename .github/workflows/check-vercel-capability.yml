name: check-vercel-capability

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check secret presence only
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" && echo "VERCEL_TOKEN_PRESENT=YES" || echo "VERCEL_TOKEN_PRESENT=NO"
          test -n "${VERCEL_ORG_ID:-}" && echo "VERCEL_ORG_ID_PRESENT=YES" || echo "VERCEL_ORG_ID_PRESENT=NO"
          test -n "${VERCEL_PROJECT_ID:-}" && echo "VERCEL_PROJECT_ID_PRESENT=YES" || echo "VERCEL_PROJECT_ID_PRESENT=NO"
