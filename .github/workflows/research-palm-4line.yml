name: research-palm-4line

on:
  push:
    branches: [research/palm-4line-model]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch public four-line model candidate
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git clone https://huggingface.co/spaces/lsh8458/palm-lines-api /tmp/palm-lines-api
          echo "=== candidate files ==="
          find /tmp/palm-lines-api -maxdepth 1 -type f -printf "%f %s bytes\n" | sort
          test -f /tmp/palm-lines-api/palm_yolo_best.pt
          cp /tmp/palm-lines-api/palm_yolo_best.pt /tmp/palm_yolo_best.pt
          ls -lh /tmp/palm_yolo_best.pt

      - name: Install model runtime
        run: python -m pip install --quiet ultralytics pillow

      - name: Inspect four-line model
        shell: bash
        run: |
          python - <<'PY'
          from ultralytics import YOLO
          model = YOLO("/tmp/palm_yolo_best.pt")
          print("MODEL_TASK", model.task)
          print("MODEL_NAMES", model.names)
          print("MODEL_COUNT", len(model.names))
          required = {"life", "heart", "head", "fate"}
          normalized = {str(v).strip().lower().replace("_"," ").replace("-"," ") for v in model.names.values()}
          normalized = {x.replace(" line","").strip() for x in normalized}
          print("NORMALIZED_NAMES", sorted(normalized))
          missing = required - normalized
          if missing:
              raise SystemExit(f"Missing expected line classes: {sorted(missing)}")
          PY

      - name: Run public sample inference
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/samuelwbarber/palm-line-reader/main/docs/example2_input.png \
            -o /tmp/palm_sample.png
          python - <<'PY'
          from ultralytics import YOLO
          model = YOLO("/tmp/palm_yolo_best.pt")
          result = model.predict("/tmp/palm_sample.png", conf=0.10, imgsz=640, verbose=False)[0]
          print("SAMPLE_SHAPE", result.orig_shape)
          print("DETECTION_COUNT", 0 if result.boxes is None else len(result.boxes))
          if result.boxes is None:
              raise SystemExit("No detections object returned")
          rows = []
          for i in range(len(result.boxes)):
              cls_id = int(result.boxes.cls[i].item())
              conf = float(result.boxes.conf[i].item())
              name = result.names[cls_id]
              box = [round(float(x), 1) for x in result.boxes.xyxy[i].tolist()]
              kp_count = 0
              if result.keypoints is not None and len(result.keypoints) > i:
                  kp_count = len(result.keypoints.xy[i])
              rows.append((name, round(conf, 4), kp_count, box))
          rows.sort(key=lambda x: x[1], reverse=True)
          print("DETECTIONS")
          for row in rows:
              print(row)
          detected = {str(r[0]).lower().replace("_"," ").replace("-"," ").replace(" line","").strip() for r in rows}
          print("DETECTED_CLASSES", sorted(detected))
          PY

      - name: Export and validate ONNX candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet onnx onnxruntime
          python - <<'PY'
          import os
          import shutil
          import onnx
          from ultralytics import YOLO

          source = YOLO("/tmp/palm_yolo_best.pt")
          nms_mode = True
          try:
              exported = source.export(
                  format="onnx",
                  imgsz=640,
                  opset=17,
                  simplify=False,
                  dynamic=False,
                  nms=True,
                  device="cpu",
              )
          except Exception as exc:
              print("ONNX_NMS_EXPORT_FAILED", repr(exc))
              nms_mode = False
              exported = source.export(
                  format="onnx",
                  imgsz=640,
                  opset=17,
                  simplify=False,
                  dynamic=False,
                  nms=False,
                  device="cpu",
              )

          print("ONNX_PATH", exported)
          print("ONNX_SIZE_BYTES", os.path.getsize(exported))
          print("ONNX_NMS_EMBEDDED", nms_mode)
          shutil.copy2(exported, "/tmp/palm_4line.onnx")

          graph = onnx.load(exported)
          def shape_of(value):
              dims = []
              for d in value.type.tensor_type.shape.dim:
                  dims.append(d.dim_value if d.dim_value else d.dim_param or "?")
              return dims
          print("ONNX_INPUTS", [(x.name, shape_of(x)) for x in graph.graph.input])
          print("ONNX_OUTPUTS", [(x.name, shape_of(x)) for x in graph.graph.output])

          runtime = YOLO(exported, task="pose")
          result = runtime.predict("/tmp/palm_sample.png", conf=0.10, imgsz=640, verbose=False)[0]
          rows = []
          if result.boxes is not None:
              for i in range(len(result.boxes)):
                  cls_id = int(result.boxes.cls[i].item())
                  conf = float(result.boxes.conf[i].item())
                  name = result.names[cls_id]
                  kp_count = 0
                  if result.keypoints is not None and len(result.keypoints) > i:
                      kp_count = len(result.keypoints.xy[i])
                  rows.append((name, round(conf, 4), kp_count))
          rows.sort(key=lambda x: x[1], reverse=True)
          print("ONNX_DETECTIONS", rows)
          detected = {str(r[0]).lower().replace("_"," ").replace("-"," ").replace(" line","").strip() for r in rows}
          print("ONNX_DETECTED_CLASSES", sorted(detected))
          required = {"life", "heart", "head", "fate"}
          if not required.issubset(detected):
              raise SystemExit(f"ONNX candidate lost classes: {sorted(required - detected)}")
          PY

      - name: Upload ONNX candidate
        uses: actions/upload-artifact@v4
        with:
          name: palm-4line-onnx
          path: /tmp/palm_4line.onnx
          if-no-files-found: error
          retention-days: 3
