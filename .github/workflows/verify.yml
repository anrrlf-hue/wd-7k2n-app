name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Palm secondary regression
        run: node scripts/test-palm-secondary-regressions.mjs

      - name: Palm fate fusion regression
        run: node scripts/test-palm-fate-fusion.mjs

      - name: Palm secondary export regression
        run: node scripts/test-palm-secondary-export.mjs

      - name: Palm Roboflow import regression
        run: node scripts/test-palm-roboflow-import.mjs

      - name: Saju engine identity regression
        run: node scripts/test-saju-engine-identity.mjs

      - name: Finance regression
        run: node scripts/test-finance-regressions.mjs

      - name: Reality answer regression
        run: node scripts/test-reality-answer-regressions.mjs

      - name: Question engine V0
        run: node scripts/test-question-engine-v0.mjs

      - name: Person compare V0
        run: node scripts/test-person-compare-v0.mjs

      - name: Reading style V1
        run: node scripts/test-reading-style-v1.mjs

      - name: Free Saju V3 regression
        run: node scripts/test-free-saju-v3.mjs

      - name: Build
        run: pnpm build
