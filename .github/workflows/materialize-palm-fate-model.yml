name: materialize-palm-fate-model

on:
  push:
    branches: [feature/palm-fate-model]

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[model-materialized]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/palm-fate-model

      - name: Stop if model already exists
        id: check
        shell: bash
        run: |
          if [ -f public/models/palm_4line_pose.onnx ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.exists != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and export model
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git lfs install
          git clone https://huggingface.co/spaces/lsh8458/palm-lines-api /tmp/palm-lines-api
          python -m pip install --quiet ultralytics onnx
          python - <<'PY'
          import os, shutil
          from ultralytics import YOLO

          source = YOLO("/tmp/palm-lines-api/palm_yolo_best.pt")
          exported = source.export(
              format="onnx",
              imgsz=640,
              opset=17,
              simplify=False,
              dynamic=False,
              nms=True,
              device="cpu",
          )
          os.makedirs("public/models", exist_ok=True)
          shutil.copy2(exported, "public/models/palm_4line_pose.onnx")
          print("MODEL_BYTES", os.path.getsize("public/models/palm_4line_pose.onnx"))
          PY

          cat > public/models/palm_4line_pose.LICENSE.txt <<'EOF'
          Palm 4-line pose model
          Source: https://huggingface.co/spaces/lsh8458/palm-lines-api
          Model classes: fate, head, heart, life
          License declared by the source Space: CC BY 4.0
          Related dataset benchmark: https://universe.roboflow.com/palm-3q4ws/palm-lines-recognition-full
          Attribution retained for model reuse in this project.
          EOF

      - name: Commit model to feature branch
        if: steps.check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/models/palm_4line_pose.onnx public/models/palm_4line_pose.LICENSE.txt
          git commit -m "Add browser four-line palm model [model-materialized]"
          git push origin HEAD:feature/palm-fate-model
